<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ChromaCon: JetBrains Mono (Nerd Font), bold, everywhere. -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>

  <!-- JetBrains Mono is always bold (requests usually carry no weight, so
       this assigns rather than compares; ExtraBold requests become Bold). -->
  <match target="pattern">
    <test name="family" compare="contains"><string>JetBrains</string></test>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
</fontconfig>
